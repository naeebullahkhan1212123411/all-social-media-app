<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Social Media App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 25px;
    }
    .box {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 15px;
    }
    button, input {
      margin: 10px;
      padding: 12px;
      border-radius: 8px;
    }
    button {
      cursor: pointer;
      background: #16a34a;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>All Social Media App</h1>
    <p>ایک ویڈیو منتخب کریں</p>
    <input type="file" id="video" accept="video/*">
    <h3>اپنا پلیٹ فارم منتخب کریں</h3>
    <button onclick="openSite('https://www.youtube.com/upload')">YouTube</button>
    <button onclick="openSite('https://www.facebook.com/')">Facebook</button>
    <button onclick="openSite('https://www.instagram.com/')">Instagram</button>
    <button onclick="openSite('https://www.tiktok.com/')">TikTok</button>
    <p id="message">ویڈیو منتخب کرنے کے بعد پلیٹ فارم کھولیں۔</p>
  </div>
  <script>
    function openSite(url) {
      const video = document.getElementById('video');
      if (!video.files.length) {
        document.getElementById('message').textContent =
          'پہلے ویڈیو منتخب کریں۔';
        return;
      }
      window.open(url, '_blank');
      document.getElementById('message').textContent =
        'پلیٹ فارم کھل گیا ہے۔ ویڈیو وہاں الگ سے اپلوڈ کریں۔';
    }
  </script>
</body>
</html>
